<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Stylish background elements -->
  <defs>
    <!-- Gradient definition -->
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4BF;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#0F766E;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Background shape -->
  <path d="M50 200 L200 50 L350 200 L200 350 Z" 
        fill="url(#gradient)" 
        opacity="0.8"/>
  
  <!-- Main logo group -->
  <g transform="translate(100, 80)">
    <!-- Elegant Y construction -->
    <!-- Left diagonal -->
    <path d="M70 40 
             Q 90 60, 100 90" 
          stroke="#2DD4BF" 
          stroke-width="18" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Right diagonal -->
    <path d="M130 40 
             Q 110 60, 100 90" 
          stroke="#2DD4BF" 
          stroke-width="18" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Vertical stem with style -->
    <path d="M100 85 
             Q 100 120, 100 180" 
          stroke="#0F766E" 
          stroke-width="18" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Premium accent elements -->
    <circle cx="100" cy="90" r="9" fill="#5EEAD4"/>
    
    <!-- Modern geometric accents -->
    <path d="M60 200 L140 200" 
          stroke="#64748B" 
          stroke-width="1.5" 
          opacity="0.5"/>
    
    <!-- Subtle design elements -->
    <rect x="90" y="210" width="20" height="2" 
          fill="#2DD4BF" 
          opacity="0.8"/>
          
    <!-- Dynamic side accents -->
    <path d="M40 90 L60 90" 
          stroke="#5EEAD4" 
          stroke-width="2" 
          opacity="0.6"/>
    <path d="M140 90 L160 90" 
          stroke="#5EEAD4" 
          stroke-width="2" 
          opacity="0.6"/>
          
    <!-- Premium corner accents -->
    <circle cx="40" cy="40" r="3" fill="#2DD4BF" opacity="0.4"/>
    <circle cx="160" cy="40" r="3" fill="#2DD4BF" opacity="0.4"/>
  </g>
</svg>
